[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dgs-shiphero"
version = "0.2.0"
description = "Shared ShipHero GraphQL client for Darn Good Ship (ops-portal + dgs-returns)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["dgs_shiphero*"]
